AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  AIVIC Backend — 営業支援システムの構築
  DynamoDB + Lambda + API Gateway

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    Environment:
      Variables:
        NODE_ENV: production

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name

Resources:
  # ── DynamoDB テーブル ──────────────────────────────────────────

  DynamoDBTable0:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table0"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 営業支援システムの構築
        - Key: TableIndex
          Value: "0"
        - Key: TableName
          Value: "単価交渉履歴"

  DynamoDBTable1:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table1"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 営業支援システムの構築
        - Key: TableIndex
          Value: "1"
        - Key: TableName
          Value: "市場価格データ"

  DynamoDBTable2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table2"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 営業支援システムの構築
        - Key: TableIndex
          Value: "2"
        - Key: TableName
          Value: "購買パターン分析結果"

  DynamoDBTable3:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table3"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      Tags:
        - Key: System
          Value: 営業支援システムの構築
        - Key: TableIndex
          Value: "3"
        - Key: TableName
          Value: "価格戦略分析結果"

  # ── Lambda 関数 ───────────────────────────────────────────────
  AivicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: lambda/
      Handler: handler.handler
      Description: "AIVIC CRUD API for 営業支援システムの構築"
      Environment:
        Variables:
        AIVIC_TABLE_0: !Ref DynamoDBTable0
        AIVIC_TABLE_1: !Ref DynamoDBTable1
        AIVIC_TABLE_2: !Ref DynamoDBTable2
        AIVIC_TABLE_3: !Ref DynamoDBTable3
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
            - !GetAtt DynamoDBTable0.Arn
            - !GetAtt DynamoDBTable1.Arn
            - !GetAtt DynamoDBTable2.Arn
            - !GetAtt DynamoDBTable3.Arn
      Events:
        ApiRoot:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{tableIndex}
            Method: ANY
        ApiItem:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{tableIndex}/{id}
            Method: ANY
        ApiOptions:
          Type: Api
          Properties:
            RestApiId: !Ref AivicApi
            Path: /api/{proxy+}
            Method: OPTIONS

  # ── API Gateway ───────────────────────────────────────────────
  AivicApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref StageName
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

Outputs:
  ApiBaseUrl:
    Description: "API Gateway base URL (config.js に設定してください)"
    Value: !Sub "https://${AivicApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  Table0Name:
    Description: "DynamoDB table name for 単価交渉履歴"
    Value: !Ref DynamoDBTable0

  Table1Name:
    Description: "DynamoDB table name for 市場価格データ"
    Value: !Ref DynamoDBTable1

  Table2Name:
    Description: "DynamoDB table name for 購買パターン分析結果"
    Value: !Ref DynamoDBTable2

  Table3Name:
    Description: "DynamoDB table name for 価格戦略分析結果"
    Value: !Ref DynamoDBTable3
