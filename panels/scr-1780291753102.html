ion":"通知設定を作成したユーザー"},{"name":"作成日時","type":"timestamp","required":true,"description":"通知設定の作成日時"},{"name":"更新者","type":"varchar(100)","required":false,"description":"通知設定を最後に更新したユーザー"},{"name":"更新日時","type":"timestamp","required":false,"description":"通知設定の最終更新日時"}]},{"tableName":"システム利用ログ","purpose":"Web発注プラットフォームの利用状況を記録し、システムの使用実績やユーザー行動を分析するためのログデータを管理する","columns":[{"name":"ログID","type":"uuid","required":true,"description":"システム利用ログの一意識別子"},{"name":"ユーザーID","type":"varchar(100)","required":true,"description":"操作を行ったユーザーの識別子"},{"name":"セッションID","type":"varchar(100)","required":true,"description":"ユーザーのログインセッション識別子"},{"name":"アクセス日時","type":"timestamp","required":true,"description":"システムにアクセスした日時"},{"name":"操作種別","type":"varchar(100)","required":true,"description":"実行された操作の種類（ログイン、発注登録、検索、レポート生成等）"},{"name":"画面名","type":"varchar(100)","required":true,"description":"アクセスした画面・機能名"},{"name":"IPアドレス","type":"varchar(100)","required":true,"description":"アクセス元のIPアドレス"},{"name":"ユーザーエージェント","type":"text","required":false,"description":"ブラウザ情報"},{"name":"処理結果","type":"varchar(100)","required":true,"description":"操作の結果（成功、失敗、エラー等）"},{"name":"エラーメッセージ","type":"text","required":false,"description":"エラーが発生した場合のエラー内容"},{"name":"処理時間","type":"integer","required":false,"description":"処理にかかった時間（ミリ秒）"},{"name":"参照URL","type":"text","required":false,"description":"アクセス前のページURL"},{"name":"対象データID","type":"varchar(100)","required":false,"description":"操作対象となったデータの識別子（発注ID、レポートID等）"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  let currentReports = tables[0]?.records || [];\n  let selectedReportId = null;\n\n  // ファイルサイズをフォーマット\n  function formatFileSize(bytes) {\n    if (!bytes) return '-';\n    const sizes = ['B', 'KB', 'MB', 'GB'];\n    const i = Math.floor(Math.log(bytes) / Math.log(1024));\n    return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];\n  }\n\n  // 日時をフォーマット\n  function formatDateTime(dateStr) {\n    if (!dateStr) return '-';\n    const date = new Date(dateStr);\n    return date.toLocaleDateString('ja-JP') + ' ' + date.toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'});\n  }\n\n  // ステータスバッジを生成\n  function getStatusBadge(status) {\n    const statusColors = {\n      '完了': 'background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3);',\n      '実行中': 'background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3);',\n      'エラー': 'background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);',\n      'キャンセル': 'background: rgba(107, 114, 128, 0.1); color: #6b7280; border: 1px solid rgba(107, 114, 128, 0.3);'\n    };\n    const style = statusColors[status] || 'background: rgba(107, 114, 128, 0.1); color: #6b7280; border: 1px solid rgba(107, 114, 128, 0.3);';\n    return `<span class=\"px-2 py-1 rounded text-xs\" style=\"${style}\">${status}</span>`;\n  }\n\n  // テーブル再描画関数\n  function renderRows(rows) {\n    const tbody = container.querySelector('#report-history-tbody');\n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.レポート生成履歴ID || r.id}\" class=\"hover:bg-opacity-50 cursor-pointer\" \n          style=\"border-bottom: 1px solid var(--border);\">\n        <td class=\"py-2 px-3 text-sm\" style=\"color: var(--text);\">${r.レポート名 || ''}</td>\n        <td class=\"py-2 px-3 text-sm\" style=\"color: var(--text);\">${r.レポート種別 || ''}</td>\n        <td class=\"py-2 px-3 text-sm\" style=\"color: var(--text);\">${formatDateTime(r.生成開始日時)}</td>\n        <td class=\"py-2 px-3 text-sm\">${getStatusBadge(r.生成ステータス || '')}</td>\n        <td class=\"py-2 px-3 text-sm\" style=\"color: var(--text);\">${formatFileSize(r.ファイルサイズ)}</td>\n        <td class=\"py-2 px-3 text-sm\" style=\"color: var(--text);\">${r.作成者名 || '-'}</td>\n        <td class=\"py-2 px-3 text-sm\">\n          <button class=\"action-btn secondary text-xs px-2 py-1 view-detail-btn\" data-id=\"${r.レポート生成履歴ID || r.id}\"\n                  style=\"background: transparent; border: 1px solid rgba(255,255,255,0.18); color: var(--text); border-radius: 3px;\">\n            詳細\n          </button>\n        </td>\n      </tr>\n    `).join('');\n  }\n\n  // 初期データ描画\n  renderRows(currentReports);\n\n  // 検索機能\n  container.querySelector('#btn-search').addEventListener('click', async () => {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const reportType = container.querySelector('#report-type-filter').value;\n    const status = container.querySelector('#status-filter').value;\n\n    try {\n      const allRows = await window.aivicApi.list(0);\n      if (!allRows) return;\n\n      let filteredRows = allRows.filter(r => {\n        let match = true;\n        \n        if (startDate && r.生成開始日時) {\n          const recordDate = new Date(r.生成開始日時).toISOString().split('T')[0];\n          match = match && recordDate >= startDate;\n        }\n        \n        if (endDate && r.生成開始日時) {\n          const recordDate = new Date(r.生成開始日時).toISOString().split('T')[0];\n          match = match && recordDate <= endDate;\n        }\n        \n        if (reportType) {\n          match = match && (r.レポート種別 || '').includes(reportType);\n        }\n        \n        if (status) {\n          match = match && (r.生成ステータス || '') === status;\n        }\n        \n        return match;\n      });\n\n      currentReports = filteredRows;\n      renderRows(filteredRows);\n    } catch (error) {\n      console.error('検索エラー:', error);\n    }\n  });\n\n  // CSVエクスポート機能\n  container.querySelector('#btn-export').addEventListener('click', async () => {\n    try {\n      const allRows = await window.aivicApi.list(0);\n      if (!allRows || allRows.length === 0) {\n        alert('エクスポートするデータがありません');\n        return;\n      }\n\n      const headers = ['レポート名', 'レポート種別', '生成開始日時', '生成完了日時', '生成ステータス', 'ファイルサイズ', '処理時間秒', 'ダウンロード回数', '作成者名'];\n      const csvContent = '\\uFEFF' + [\n        headers.join(','),\n        ...allRows.map(r => [\n          `\"${r.レポート名 || ''}\"`,\n          `\"${r.レポート種別 || ''}\"`,\n          `\"${r.生成開始日時 || ''}\"`,\n          `\"${r.生成完了日時 || ''}\"`,\n          `\"${r.生成ステータス || ''}\"`,\n          r.ファイルサイズ || 0,\n          r.処理時間秒 || 0,\n          r.ダウンロード回数 || 0,\n          `\"${r.作成者名 || ''}\"`\n        ].join(','))\n      ].join('\\n');\n\n      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = `レポート生成履歴_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n    } catch (error) {\n      console.error('CSVエクスポートエラー:', error);\n      alert('CSVエクスポートに失敗しました');\n    }\n  });\n\n  // 詳細表示機能\n  container.addEventListener('click', (e) => {\n    const viewBtn = e.target.closest('.view-detail-btn');\n    if (viewBtn) {\n      const reportId = viewBtn.dataset.id;\n      const report = currentReports.find(r => (r.レポート生成履歴ID || r.id) === reportId);\n      if (report) {\n        showReportDetail(report);\n      }\n    }\n\n    // 行クリックでも詳細表示\n    const row = e.target.closest('tr[data-id]');\n    if (row && !e.target.closest('button')) {\n      const reportId = row.dataset.id;\n      const report = currentReports.find(r => (r.レポート生成履歴ID || r.id) === reportId);\n      if (report) {\n        showReportDetail(report);\n      }\n    }\n  });\n\n  // レポート詳細表示\n  function showReportDetail(report) {\n    selectedReportId = report.レポート生成履歴ID || report.id;\n    \n    container.querySelector('#detail-report-name').textContent = report.レポート名 || '';\n    container.querySelector('#detail-report-type').textContent = report.レポート種別 || '';\n    container.querySelector('#detail-start-time').textContent = formatDateTime(report.生成開始日時);\n    container.querySelector('#detail-end-time').textContent = formatDateTime(report.生成完了日時);\n    \n    const startDate = report.対象期間開始日 ? new Date(report.対象期間開始日).toLocaleDateString('ja-JP') : '';\n    const endDate = report.対象期間終了日 ? new Date(report.対象期間終了日).toLocaleDateString('ja-JP') : '';\n    container.querySelector('#detail-target-period').textContent = startDate && endDate ? `${startDate} ～ ${endDate}` : '-';\n    \n    container.querySelector('#detail-process-time').textContent = report.処理時間秒 ? `${report.処理時間秒}秒` : '-';\n    container.querySelector('#detail-file-size').textContent = formatFileSize(report.ファイルサイズ);\n    container.querySelector('#detail-download-count').textContent = `${report.ダウンロード回数 || 0}回`;\n\n    // エラーメッセージの表示制御\n    const errorSection = container.querySelector('#error-section');\n    if (report.生成ステータス === 'エラー' && report.エラーメッセージ) {\n      container.querySelector('#detail-error-message').textContent = report.エラーメッセージ;\n      errorSection.style.display = 'block';\n    } else {\n      errorSection.style.display = 'none';\n    }\n\n    // ダウンロードボタンの有効/無効制御\n    const downloadBtn = container.querySelector('#download-report');\n    downloadBtn.disabled = report.生成ステータス !== '完了';\n    if (downloadBtn.disabled) {\n      downloadBtn.style.opacity = '0.5';\n      downloadBtn.style.cursor = 'not-allowed';\n    } else {\n      downloadBtn.style.opacity = '1';\n      downloadBtn.style.cursor = 'pointer';\n    }\n\n    container.querySelector('#report-detail-modal').style.display = 'flex';\n  }\n\n  // モーダル閉じる\n  container.querySelector('#close-modal').addEventListener('click', () => {\n    container.querySelector('#report-detail-modal').style.display = 'none';\n  });\n\n  // モーダル背景クリックで閉じる\n  container.querySelector('#report-detail-modal').addEventListener('click', (e) => {\n    if (e.target === container.querySelector('#report-detail-modal')) {\n      container.querySelector('#report-detail-modal').style.display = 'none';\n    }\n  });\n\n  // ダウンロード機能\n  container.querySelector('#download-report').addEventListener('click', async () => {\n    if (!selectedReportId) return;\n    \n    try {\n      const report = currentReports.find(r => (r.レポート生成履歴ID || r.id) === selectedReportId);\n      if (report && report.生成ステータス === '完了') {\n        // ダウンロード回数を更新\n        const updatedReport = await window.aivicApi.update(0, selectedReportId, {\n          ダウンロード回数: (report.ダウンロード回数 || 0) + 1,\n          最終ダウンロード日時: new Date().toISOString()\n        });\n        \n        if (updatedReport) {\n          // 実際のファイルダウンロード処理（模擬）\n          alert(`レポート「${report.レポート名}」をダウンロードしました`);\n          \n          // 一覧を更新\n          const refreshedRows = await window.aivicApi.list(0);\n          if (refreshedRows) {\n            currentReports = refreshedRows;\n            renderRows(refreshedRows);\n          }\n          \n          container.querySelector('#report-detail-modal').style.display = 'none';\n        }\n      }\n    } catch (error) {\n      console.error('ダウンロードエラー:', error);\n      alert('ダウンロードに失敗しました');\n    }\n  });\n\n  // 削除機能\n  container.querySelector('#delete-report').addEventListener('click', async () => {\n    if (!selectedReportId) return;\n    \n    if (!confirm('このレポートを削除しますか？')) return;\n    \n    try {\n      await window.aivicApi.delete(0, selectedReportId);\n      \n      // 一覧を更新\n      const refreshedRows = await window.aivicApi.list(0);\n      if (refreshedRows) {\n        currentReports = refreshedRows;\n        renderRows(refreshedRows);\n      }\n      \n      container.querySelector('#report-detail-modal').style.display = 'none';\n      alert('レポートを削除しました');\n    } catch (error) {\n      console.error('削除エラー:', error);\n      alert('削除に失敗しました');\n    }\n  });\n}";
</script>

<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
