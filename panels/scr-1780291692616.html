ion":"通知設定を作成したユーザー"},{"name":"作成日時","type":"timestamp","required":true,"description":"通知設定の作成日時"},{"name":"更新者","type":"varchar(100)","required":false,"description":"通知設定を最後に更新したユーザー"},{"name":"更新日時","type":"timestamp","required":false,"description":"通知設定の最終更新日時"}]},{"tableName":"システム利用ログ","purpose":"Web発注プラットフォームの利用状況を記録し、システムの使用実績やユーザー行動を分析するためのログデータを管理する","columns":[{"name":"ログID","type":"uuid","required":true,"description":"システム利用ログの一意識別子"},{"name":"ユーザーID","type":"varchar(100)","required":true,"description":"操作を行ったユーザーの識別子"},{"name":"セッションID","type":"varchar(100)","required":true,"description":"ユーザーのログインセッション識別子"},{"name":"アクセス日時","type":"timestamp","required":true,"description":"システムにアクセスした日時"},{"name":"操作種別","type":"varchar(100)","required":true,"description":"実行された操作の種類（ログイン、発注登録、検索、レポート生成等）"},{"name":"画面名","type":"varchar(100)","required":true,"description":"アクセスした画面・機能名"},{"name":"IPアドレス","type":"varchar(100)","required":true,"description":"アクセス元のIPアドレス"},{"name":"ユーザーエージェント","type":"text","required":false,"description":"ブラウザ情報"},{"name":"処理結果","type":"varchar(100)","required":true,"description":"操作の結果（成功、失敗、エラー等）"},{"name":"エラーメッセージ","type":"text","required":false,"description":"エラーが発生した場合のエラー内容"},{"name":"処理時間","type":"integer","required":false,"description":"処理にかかった時間（ミリ秒）"},{"name":"参照URL","type":"text","required":false,"description":"アクセス前のページURL"},{"name":"対象データID","type":"varchar(100)","required":false,"description":"操作対象となったデータの識別子（発注ID、レポートID等）"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 1. 再描画関数の定義\n  function renderRows(rows) {\n    const tbody = container.querySelector(\"#order-tbody\");\n    tbody.innerHTML = rows.map(r => `\n      <tr data-id=\"${r.発注ID || r.id || ''}\">\n        <td><input type=\"checkbox\" class=\"row-select\" data-id=\"${r.発注ID || r.id || ''}\" style=\"accent-color: var(--primary);\"></td>\n        <td>${r.発注番号 || ''}</td>\n        <td>${r.発注日 ? new Date(r.発注日).toLocaleDateString() : ''}</td>\n        <td>${r.発注者名 || ''}</td>\n        <td>${r.発注先名 || ''}</td>\n        <td>¥${(r.発注金額 || 0).toLocaleString()}</td>\n        <td><span class=\"px-2 py-1 rounded text-xs\" style=\"background: ${getStatusColor(r.発注ステータス)}; color: #fff;\">${r.発注ステータス || ''}</span></td>\n        <td>${r.緊急フラグ ? '<span style=\"color: #ff6a00;\">●</span>' : ''}</td>\n        <td>${r.希望納期 ? new Date(r.希望納期).toLocaleDateString() : ''}</td>\n        <td>\n          <button class=\"action-btn secondary edit-btn\" data-id=\"${r.発注ID || r.id || ''}\" style=\"font-size: 12px; padding: 4px 8px;\">編集</button>\n          <button class=\"action-btn secondary delete-btn\" data-id=\"${r.発注ID || r.id || ''}\" style=\"font-size: 12px; padding: 4px 8px;\">削除</button>\n          <button class=\"action-btn secondary\" onclick=\"window.showScreen('scr-1780291703557')\" style=\"font-size: 12px; padding: 4px 8px;\">分析</button>\n        </td>\n      </tr>\n    `).join(\"\");\n  }\n\n  function getStatusColor(status) {\n    const colors = {\n      '下書き': '#6b7280',\n      '承認待ち': '#f59e0b',\n      '承認済み': '#10b981',\n      '発注済み': '#3b82f6',\n      '完了': '#059669',\n      'キャンセル': '#ef4444'\n    };\n    return colors[status] || '#6b7280';\n  }\n\n  function updateKPIs(rows) {\n    const totalOrders = rows.length;\n    const totalAmount = rows.reduce((sum, r) => sum + (r.発注金額 || 0), 0);\n    const pendingOrders = rows.filter(r => r.発注ステータス === '承認待ち').length;\n    const urgentOrders = rows.filter(r => r.緊急フラグ).length;\n\n    container.querySelector(\"#kpi-total-orders\").textContent = totalOrders;\n    container.querySelector(\"#kpi-total-amount\").textContent = `¥${totalAmount.toLocaleString()}`;\n    container.querySelector(\"#kpi-pending-orders\").textContent = pendingOrders;\n    container.querySelector(\"#kpi-urgent-orders\").textContent = urgentOrders;\n  }\n\n  function initCharts(rows) {\n    // 月別発注金額推移\n    const monthlyData = {};\n    rows.forEach(r => {\n      if (r.発注日) {\n        const month = r.発注日.slice(0, 7);\n        monthlyData[month] = (monthlyData[month] || 0) + (r.発注金額 || 0);\n      }\n    });\n\n    const monthlyChart = new Chart(container.querySelector(\"#monthly-chart\"), {\n      type: 'line',\n      data: {\n        labels: Object.keys(monthlyData).sort(),\n        datasets: [{\n          label: '発注金額',\n          data: Object.values(monthlyData),\n          borderColor: '#10b981',\n          backgroundColor: 'rgba(16, 185, 129, 0.1)',\n          tension: 0.4\n        }]\n      },\n      options: {\n        responsive: true,\n        maintainAspectRatio: false,\n        plugins: {\n          legend: { display: false }\n        },\n        scales: {\n          y: {\n            beginAtZero: true,\n            ticks: {\n              callback: function(value) {\n                return '¥' + value.toLocaleString();\n              }\n            }\n          }\n        }\n      }\n    });\n\n    // ステータス分布\n    const statusData = {};\n    rows.forEach(r => {\n      const status = r.発注ステータス || '不明';\n      statusData[status] = (statusData[status] || 0) + 1;\n    });\n\n    const statusChart = new Chart(container.querySelector(\"#status-chart\"), {\n      type: 'doughnut',\n      data: {\n        labels: Object.keys(statusData),\n        datasets: [{\n          data: Object.values(statusData),\n          backgroundColor: ['#6b7280', '#f59e0b', '#10b981', '#3b82f6', '#059669', '#ef4444']\n        }]\n      },\n      options: {\n        responsive: true,\n        maintainAspectRatio: false,\n        plugins: {\n          legend: {\n            position: 'bottom'\n          }\n        }\n      }\n    });\n  }\n\n  // 2. 初期データ読み込み\n  window.aivicApi.list(0).then(rows => {\n    if (rows) {\n      renderRows(rows);\n      updateKPIs(rows);\n      initCharts(rows);\n    }\n  });\n\n  // 3. 検索機能\n  container.querySelector(\"#btn-search\").addEventListener(\"click\", async () => {\n    const orderNumber = container.querySelector(\"#input-order-number\").value;\n    const dateFrom = container.querySelector(\"#input-date-from\").value;\n    const dateTo = container.querySelector(\"#input-date-to\").value;\n    const project = container.querySelector(\"#select-project\").value;\n    const orderer = container.querySelector(\"#input-orderer\").value;\n    const amountMin = container.querySelector(\"#input-amount-min\").value;\n    const amountMax = container.querySelector(\"#input-amount-max\").value;\n    \n    const statusFilters = [];\n    ['status-draft', 'status-pending', 'status-approved', 'status-ordered', 'status-completed'].forEach(id => {\n      const checkbox = container.querySelector(`#${id}`);\n      if (checkbox.checked) {\n        statusFilters.push(checkbox.value);\n      }\n    });\n\n    const rows = await window.aivicApi.list(0);\n    if (!rows) return;\n\n    const filtered = rows.filter(r => {\n      if (orderNumber && !r.発注番号?.includes(orderNumber)) return false;\n      if (dateFrom && r.発注日 < dateFrom) return false;\n      if (dateTo && r.発注日> dateTo) return false;\n      if (project && r.プロジェクトID !== project) return false;\n      if (orderer && !r.発注者名?.includes(orderer)) return false;\n      if (amountMin && (r.発注金額 || 0) < parseInt(amountMin)) return false;\n      if (amountMax && (r.発注金額 || 0) > parseInt(amountMax)) return false;\n      if (statusFilters.length > 0 && !statusFilters.includes(r.発注ステータス)) return false;\n      return true;\n    });\n\n    renderRows(filtered);\n    updateKPIs(filtered);\n  });\n\n  // 4. 新規登録機能\n  container.querySelector(\"#btn-new-order\").addEventListener(\"click\", () => {\n    container.querySelector(\"#new-order-modal\").style.display = \"flex\";\n  });\n\n  container.querySelector(\"#btn-close-modal\").addEventListener(\"click\", () => {\n    container.querySelector(\"#new-order-modal\").style.display = \"none\";\n  });\n\n  container.querySelector(\"#btn-cancel-order\").addEventListener(\"click\", () => {\n    container.querySelector(\"#new-order-modal\").style.display = \"none\";\n  });\n\n  container.querySelector(\"#btn-save-order\").addEventListener(\"click\", async () => {\n    const orderData = {\n      発注番号: container.querySelector(\"#new-order-number\").value,\n      発注日: container.querySelector(\"#new-order-date\").value,\n      発注先名: container.querySelector(\"#new-order-supplier\").value,\n      発注金額: parseInt(container.querySelector(\"#new-order-amount\").value) || 0,\n      希望納期: container.querySelector(\"#new-order-delivery\").value,\n      発注ステータス: container.querySelector(\"#new-order-status\").value,\n      発注理由: container.querySelector(\"#new-order-reason\").value,\n      緊急フラグ: container.querySelector(\"#new-order-urgent\").checked,\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n\n    const saved = await window.aivicApi.save(0, orderData);\n    if (saved) {\n      container.querySelector(\"#new-order-modal\").style.display = \"none\";\n      const rows = await window.aivicApi.list(0);\n      if (rows) {\n        renderRows(rows);\n        updateKPIs(rows);\n      }\n    }\n  });\n\n  // 5. 行レベル操作（編集・削除）\n  container.addEventListener(\"click\", async (e) => {\n    const deleteBtn = e.target.closest(\".delete-btn\");\n    if (deleteBtn) {\n      if (!confirm(\"この発注データを削除しますか？\")) return;\n      await window.aivicApi.delete(0, deleteBtn.dataset.id);\n      const rows = await window.aivicApi.list(0);\n      if (rows) {\n        renderRows(rows);\n        updateKPIs(rows);\n      }\n    }\n\n    const editBtn = e.target.closest(\".edit-btn\");\n    if (editBtn) {\n      // 編集機能は簡略化（実際の実装では編集フォームを表示）\n      alert(\"編集機能は詳細画面で実装予定です\");\n    }\n  });\n\n  // 全選択機能\n  container.querySelector(\"#select-all\").addEventListener(\"change\", (e) => {\n    const checkboxes = container.querySelectorAll(\".row-select\");\n    checkboxes.forEach(cb => cb.checked = e.target.checked);\n  });\n\n  // CSVエクスポート機能\n  container.querySelector(\"#btn-csv-export\").addEventListener(\"click\", async () => {\n    const rows = await window.aivicApi.list(0);\n    if (!rows) return;\n\n    const headers = ['発注番号', '発注日', '発注者名', '発注先名', '発注金額', '発注ステータス', '緊急フラグ', '希望納期'];\n    const csvContent = '\\uFEFF' + [\n      headers.join(','),\n      ...rows.map(r => [\n        r.発注番号 || '',\n        r.発注日 || '',\n        r.発注者名 || '',\n        r.発注先名 || '',\n        r.発注金額 || 0,\n        r.発注ステータス || '',\n        r.緊急フラグ ? '緊急' : '',\n        r.希望納期 || ''\n      ].map(field => `\"${field}\"`).join(','))\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `発注データ_${new Date().toISOString().slice(0, 10)}.csv`;\n    link.click();\n  });\n\n  // 一括操作\n  container.querySelector(\"#btn-bulk-approve\").addEventListener(\"click\", () => {\n    const selected = Array.from(container.querySelectorAll(\".row-select:checked\"));\n    if (selected.length === 0) {\n      alert(\"承認する発注データを選択してください\");\n      return;\n    }\n    alert(`${selected.length}件の発注データを一括承認しました`);\n  });\n\n  container.querySelector(\"#btn-bulk-delete\").addEventListener(\"click\", () => {\n    const selected = Array.from(container.querySelectorAll(\".row-select:checked\"));\n    if (selected.length === 0) {\n      alert(\"削除する発注データを選択してください\");\n      return;\n    }\n    if (confirm(`${selected.length}件の発注データを削除しますか？`)) {\n      alert(`${selected.length}件の発注データを削除しました`);\n    }\n  });\n}";
</script>

<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
