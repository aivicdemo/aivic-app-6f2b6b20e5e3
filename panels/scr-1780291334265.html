cription":"通知方法（メール、システム内通知、両方等）"},{"name":"件名テンプレート","type":"varchar(100)","required":false,"description":"通知メールの件名テンプレート"},{"name":"本文テンプレート","type":"text","required":false,"description":"通知メールの本文テンプレート"},{"name":"発生条件","type":"text","required":true,"description":"通知が発生する条件の説明"},{"name":"優先度","type":"integer","required":true,"description":"通知の優先度（1:高、2:中、3:低）"},{"name":"有効フラグ","type":"boolean","required":true,"description":"通知設定の有効/無効状態"},{"name":"作成日時","type":"timestamp","required":true,"description":"レコード作成日時"},{"name":"作成者ID","type":"uuid","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新日時","type":"timestamp","required":true,"description":"レコード最終更新日時"},{"name":"更新者ID","type":"uuid","required":true,"description":"レコード最終更新者のユーザーID"}]},{"tableName":"通知履歴","purpose":"システムからユーザーへの通知送信履歴を管理し、通知の配信状況や既読状態を追跡する","columns":[{"name":"通知履歴ID","type":"uuid","required":true,"description":"通知履歴の一意識別子（主キー）"},{"name":"通知設定ID","type":"uuid","required":true,"description":"システム通知設定マスタへの外部キー"},{"name":"受信者ユーザーID","type":"uuid","required":true,"description":"通知を受信するユーザーのID（ログインユーザーマスタへの外部キー）"},{"name":"通知タイトル","type":"varchar(100)","required":true,"description":"通知のタイトル"},{"name":"通知内容","type":"text","required":true,"description":"通知の詳細メッセージ内容"},{"name":"通知種別","type":"varchar(100)","required":true,"description":"通知の種別（発注完了、エラー発生、システムメンテナンス等）"},{"name":"優先度","type":"varchar(100)","required":true,"description":"通知の優先度（高、中、低）"},{"name":"送信方法","type":"varchar(100)","required":true,"description":"通知の送信方法（画面通知、メール、両方）"},{"name":"送信状態","type":"varchar(100)","required":true,"description":"送信処理の状態（送信待ち、送信中、送信完了、送信失敗）"},{"name":"既読フラグ","type":"boolean","required":true,"description":"ユーザーが通知を既読したかどうか"},{"name":"関連データID","type":"uuid","required":false,"description":"通知に関連するデータのID（発注データID、連携処理履歴ID等）"},{"name":"関連データ種別","type":"varchar(100)","required":false,"description":"関連データの種別（発注データ、連携処理履歴等）"},{"name":"送信予定日時","type":"timestamp","required":true,"description":"通知の送信予定日時"},{"name": window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // 通知設定テーブル（tableIndex: 9）と通知履歴テーブル（tableIndex: 10）\n  const settingsTableIndex = 9; // システム通知設定\n  const historyTableIndex = 10; // 通知履歴\n  \n  // 通知設定一覧の再描画関数\n  function renderSettings(rows) {\n    const tbody = container.querySelector(\"#settings-tbody\");\n    tbody.innerHTML = rows.map(r => {\n      const priorityText = r.優先度 === 1 ? '高' : r.優先度 === 2 ? '中' : r.優先度 === 3 ? '低' : '';\n      const statusBadge = r.有効フラグ ? \n        '<span style=\"background: #10b981; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">有効</span>' :\n        '<span style=\"background: #6b7280; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">無効</span>';\n      \n      return `<tr data-id=\"${r.通知設定ID || r.id || ''}\">\n        <td>${r.通知名 || ''}</td>\n        <td>${r.通知種別 || ''}</td>\n        <td>${r.通知対象者種別 || ''}</td>\n        <td>${r.通知方法 || ''}</td>\n        <td>${priorityText}</td>\n        <td>${statusBadge}</td>\n        <td>${r.作成日時 ? new Date(r.作成日時).toLocaleDateString() : ''}</td>\n        <td>\n          <button class=\"action-btn secondary edit-settings-btn\" data-id=\"${r.通知設定ID || r.id || ''}\">編集</button>\n          <button class=\"action-btn secondary delete-settings-btn\" data-id=\"${r.通知設定ID || r.id || ''}\">削除</button>\n        </td>\n      </tr>`;\n    }).join(\"\");\n  }\n  \n  // 通知履歴一覧の再描画関数\n  function renderHistory(rows) {\n    const tbody = container.querySelector(\"#history-tbody\");\n    tbody.innerHTML = rows.map(r => {\n      const statusBadge = r.送信状態 === '送信完了' ? \n        '<span style=\"background: #10b981; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">送信完了</span>' :\n        r.送信状態 === '送信失敗' ?\n        '<span style=\"background: #ef4444; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">送信失敗</span>' :\n        '<span style=\"background: #f59e0b; color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 11px;\">送信待ち</span>';\n      \n      const priorityText = r.優先度 === '高' ? '高' : r.優先度 === '中' ? '中' : r.優先度 === '低' ? '低' : r.優先度 || '';\n      const readStatus = r.既読フラグ ? '既読' : '未読';\n      \n      return `<tr data-id=\"${r.通知履歴ID || r.id || ''}\">\n        <td>${r.通知タイトル || ''}</td>\n        <td>${r.通知種別 || ''}</td>\n        <td>${r.受信者ユーザーID || ''}</td>\n        <td>${r.送信方法 || ''}</td>\n        <td>${statusBadge}</td>\n        <td>${priorityText}</td>\n        <td>${readStatus}</td>\n        <td>${r.送信日時 ? new Date(r.送信日時).toLocaleDateString() : ''}</td>\n        <td>\n          <button class=\"action-btn secondary resend-btn\" data-id=\"${r.通知履歴ID || r.id || ''}\">再送</button>\n        </td>\n      </tr>`;\n    }).join(\"\");\n  }\n  \n  // 初期データ表示\n  renderSettings(tables[settingsTableIndex]?.records || []);\n  renderHistory(tables[historyTableIndex]?.records || []);\n  \n  // 最新データを取得して表示\n  window.aivicApi.list(settingsTableIndex).then(rows => {\n    if (rows) renderSettings(rows);\n  });\n  \n  window.aivicApi.list(historyTableIndex).then(rows => {\n    if (rows) renderHistory(rows);\n  });\n  \n  // 通知設定保存\n  container.querySelector(\"#btn-save-notification\").addEventListener(\"click\", async () => {\n    const notificationType = container.querySelector(\"#select-notification-type\").value;\n    const targetType = container.querySelector(\"#select-target-type\").value;\n    const notificationMethod = container.querySelector('input[name=\"notification-method\"]:checked')?.value;\n    const notificationName = container.querySelector(\"#input-notification-name\").value;\n    const priority = container.querySelector(\"#select-priority\").value;\n    const subjectTemplate = container.querySelector(\"#input-subject-template\").value;\n    const bodyTemplate = container.querySelector(\"#textarea-body-template\").value;\n    const condition = container.querySelector(\"#textarea-condition\").value;\n    const activeFlag = container.querySelector(\"#checkbox-active\").checked;\n    \n    if (!notificationType || !targetType || !notificationMethod || !notificationName) {\n      alert(\"必須項目を入力してください\");\n      return;\n    }\n    \n    const data = {\n      通知種別: notificationType,\n      通知名: notificationName,\n      通知対象者種別: targetType,\n      通知方法: notificationMethod,\n      件名テンプレート: subjectTemplate,\n      本文テンプレート: bodyTemplate,\n      発生条件: condition,\n      優先度: parseInt(priority) || 2,\n      有効フラグ: activeFlag,\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n    \n    const saved = await window.aivicApi.save(settingsTableIndex, data);\n    if (saved) {\n      const rows = await window.aivicApi.list(settingsTableIndex);\n      if (rows) renderSettings(rows);\n      \n      // フォームクリア\n      container.querySelector(\"#select-notification-type\").value = \"\";\n      container.querySelector(\"#select-target-type\").value = \"\";\n      container.querySelector(\"#input-notification-name\").value = \"\";\n      container.querySelector(\"#select-priority\").value = \"\";\n      container.querySelector(\"#input-subject-template\").value = \"\";\n      container.querySelector(\"#textarea-body-template\").value = \"\";\n      container.querySelector(\"#textarea-condition\").value = \"\";\n      container.querySelector(\"#checkbox-active\").checked = false;\n      const radioButtons = container.querySelectorAll('input[name=\"notification-method\"]');\n      radioButtons.forEach(radio => radio.checked = false);\n    }\n  });\n  \n  // フォームクリア\n  container.querySelector(\"#btn-clear-form\").addEventListener(\"click\", () => {\n    container.querySelector(\"#select-notification-type\").value = \"\";\n    container.querySelector(\"#select-target-type\").value = \"\";\n    container.querySelector(\"#input-notification-name\").value = \"\";\n    container.querySelector(\"#select-priority\").value = \"\";\n    container.querySelector(\"#input-subject-template\").value = \"\";\n    container.querySelector(\"#textarea-body-template\").value = \"\";\n    container.querySelector(\"#textarea-condition\").value = \"\";\n    container.querySelector(\"#checkbox-active\").checked = false;\n    const radioButtons = container.querySelectorAll('input[name=\"notification-method\"]');\n    radioButtons.forEach(radio => radio.checked = false);\n  });\n  \n  // 通知設定検索\n  container.querySelector(\"#btn-search-settings\").addEventListener(\"click\", async () => {\n    const keyword = container.querySelector(\"#input-search-settings\").value.toLowerCase();\n    const rows = await window.aivicApi.list(settingsTableIndex);\n    if (rows) {\n      const filtered = rows.filter(r => \n        JSON.stringify(r).toLowerCase().includes(keyword)\n      );\n      renderSettings(filtered);\n    }\n  });\n  \n  // 通知履歴検索\n  container.querySelector(\"#btn-search-history\").addEventListener(\"click\", async () => {\n    const typeFilter = container.querySelector(\"#select-history-type\").value;\n    const statusFilter = container.querySelector(\"#select-send-status\").value;\n    const startDate = container.querySelector(\"#input-start-date\").value;\n    const endDate = container.querySelector(\"#input-end-date\").value;\n    \n    const rows = await window.aivicApi.list(historyTableIndex);\n    if (rows) {\n      let filtered = rows;\n      \n      if (typeFilter) {\n        filtered = filtered.filter(r => r.通知種別 === typeFilter);\n      }\n      \n      if (statusFilter) {\n        filtered = filtered.filter(r => r.送信状態 === statusFilter);\n      }\n      \n      if (startDate) {\n        filtered = filtered.filter(r => {\n          const sendDate = r.送信日時 ? new Date(r.送信日時).toISOString().split('T')[0] : '';\n          return sendDate >= startDate;\n        });\n      }\n      \n      if (endDate) {\n        filtered = filtered.filter(r => {\n          const sendDate = r.送信日時 ? new Date(r.送信日時).toISOString().split('T')[0] : '';\n          return sendDate <= endDate;\n        });\n      }\n      \n      renderHistory(filtered);\n    }\n  });\n  \n  // CSVエクスポート\n  container.querySelector(\"#btn-export-history\").addEventListener(\"click\", async () => {\n    const rows = await window.aivicApi.list(historyTableIndex);\n    if (rows && rows.length > 0) {\n      const headers = ['通知タイトル', '通知種別', '受信者', '送信方法', '送信状態', '優先度', '既読フラグ', '送信日時'];\n      const csvContent = '\\uFEFF' + [\n        headers.join(','),\n        ...rows.map(r => [\n          `\"${r.通知タイトル || ''}\"`,\n          `\"${r.通知種別 || ''}\"`,\n          `\"${r.受信者ユーザーID || ''}\"`,\n          `\"${r.送信方法 || ''}\"`,\n          `\"${r.送信状態 || ''}\"`,\n          `\"${r.優先度 || ''}\"`,\n          `\"${r.既読フラグ ? '既読' : '未読'}\"`,\n          `\"${r.送信日時 || ''}\"`\n        ].join(','))\n      ].join('\\n');\n      \n      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n      const link = document.createElement('a');\n      link.href = URL.createObjectURL(blob);\n      link.download = `通知履歴_${new Date().toISOString().split('T')[0]}.csv`;\n      link.click();\n    }\n  });\n  \n  // テスト送信\n  container.querySelector(\"#btn-test-send\").addEventListener(\"click\", async () => {\n    const testData = {\n      通知タイトル: 'テスト通知',\n      通知内容: 'これはテスト送信です',\n      通知種別: 'システムメンテナンス',\n      優先度: '中',\n      送信方法: 'システム内通知',\n      送信状態: '送信完了',\n      既読フラグ: false,\n      受信者ユーザーID: 'test-user',\n      送信日時: new Date().toISOString(),\n      作成日時: new Date().toISOString(),\n      更新日時: new Date().toISOString()\n    };\n    \n    const saved = await window.aivicApi.save(historyTableIndex, testData);\n    if (saved) {\n      alert('テスト通知を送信しました');\n      const rows = await window.aivicApi.list(historyTableIndex);\n      if (rows) renderHistory(rows);\n    }\n  });\n  \n  // イベントデリゲーション（編集・削除・再送）\n  container.addEventListener(\"click\", async (e) => {\n    // 通知設定削除\n    const deleteBtn = e.target.closest(\".delete-settings-btn\");\n    if (deleteBtn) {\n      if (!confirm(\"この通知設定を削除しますか？\")) return;\n      await window.aivicApi.delete(settingsTableIndex, deleteBtn.dataset.id);\n      const rows = await window.aivicApi.list(settingsTableIndex);\n      if (rows) renderSettings(rows);\n      return;\n    }\n    \n    // 通知設定編集\n    const editBtn = e.target.closest(\".edit-settings-btn\");\n    if (editBtn) {\n      const rows = await window.aivicApi.list(settingsTableIndex);\n      if (rows) {\n        const record = rows.find(r => (r.通知設定ID || r.id) === editBtn.dataset.id);\n        if (record) {\n          container.querySelector(\"#select-notification-type\").value = record.通知種別 || \"\";\n          container.querySelector(\"#select-target-type\").value = record.通知対象者種別 || \"\";\n          container.querySelector(\"#input-notification-name\").value = record.通知名 || \"\";\n          container.querySelector(\"#select-priority\").value = record.優先度 || \"\";\n          container.querySelector(\"#input-subject-template\").value = record.件名テンプレート || \"\";\n          container.querySelector(\"#textarea-body-template\").value = record.本文テンプレート || \"\";\n          container.querySelector(\"#textarea-condition\").value = record.発生条件 || \"\";\n          container.querySelector(\"#checkbox-active\").checked = record.有効フラグ || false;\n          \n          const methodRadio = container.querySelector(`input[name=\"notification-method\"][value=\"${record.通知方法}\"]`);\n          if (methodRadio) methodRadio.checked = true;\n        }\n      }\n      return;\n    }\n    \n    // 通知再送\n    const resendBtn = e.target.closest(\".resend-btn\");\n    if (resendBtn) {\n      if (!confirm(\"この通知を再送しますか？\")) return;\n      \n      const rows = await window.aivicApi.list(historyTableIndex);\n      if (rows) {\n        const record = rows.find(r => (r.通知履歴ID || r.id) === resendBtn.dataset.id);\n        if (record) {\n          const updateData = {\n            ...record,\n            送信状態: '送信完了',\n            送信日時: new Date().toISOString(),\n            再送回数: (record.再送回数 || 0) + 1,\n            更新日時: new Date().toISOString()\n          };\n          \n          await window.aivicApi.update(historyTableIndex, resendBtn.dataset.id, updateData);\n          const updatedRows = await window.aivicApi.list(historyTableIndex);\n          if (updatedRows) renderHistory(updatedRows);\n          alert('通知を再送しました');\n        }\n      }\n      return;\n    }\n  });\n}";

      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");

        if (!API_URL) return [];

    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {

      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
