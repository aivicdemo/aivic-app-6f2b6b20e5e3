"text-align: right; font-weight: 600;\">¥${(row.小計金額 || row.totalAmount || 0).toLocaleString()}</td>\n        <td>${getStatusBadge(row.発注ステータス || row.status || '未確定')}</td>\n        <td>\n          <button class=\"action-btn secondary detail-btn\" data-id=\"${row.id || row.発注ID}\" style=\"background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-right: 4px;\">\n            詳細\n          </button>\n          <button class=\"action-btn reorder-btn\" data-id=\"${row.id || row.発注ID}\" style=\"background: var(--primary); color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;\">\n            再発注\n          </button>\n        </td>\n      </tr>\n    `).join('');\n\n    updatePagination(rows.length);\n  }\n\n  // ページネーション更新\n  function updatePagination(totalItems) {\n    const totalPages = Math.ceil(totalItems / pageSize);\n    const pageInfo = container.querySelector('#page-info');\n    const prevBtn = container.querySelector('#prev-page');\n    const nextBtn = container.querySelector('#next-page');\n\n    pageInfo.textContent = `${currentPage} / ${totalPages}`;\n    prevBtn.disabled = currentPage <= 1;\n    nextBtn.disabled = currentPage >= totalPages;\n  }\n\n  // 検索フィルター実行\n  function applyFilters() {\n    const startDate = container.querySelector('#start-date').value;\n    const endDate = container.querySelector('#end-date').value;\n    const orderNumber = container.querySelector('#order-number').value.toLowerCase();\n    const productName = container.querySelector('#product-name').value.toLowerCase();\n    const category = container.querySelector('#category-filter').value;\n    const status = container.querySelector('#status-filter').value;\n\n    filteredData = allOrderHistory.filter(row => {\n      // 日付フィルター\n      if (startDate || endDate) {\n        const orderDate = new Date(row.発注日時 || row.orderDate);\n        if (startDate && orderDate < new Date(startDate)) return false;\n        if (endDate && orderDate > new Date(endDate + 'T23:59:59')) return false;\n      }\n\n      // 発注番号フィルター\n      if (orderNumber && !(row.発注番号 || row.orderNumber || '').toLowerCase().includes(orderNumber)) return false;\n\n      // 商品名フィルター\n      if (productName && !(row.商品名 || row.productName || '').toLowerCase().includes(productName)) return false;\n\n      // カテゴリフィルター（実際の実装では商品マスタと結合が必要）\n      if (category && row.カテゴリ !== category) return false;\n\n      // ステータスフィルター\n      if (status && (row.発注ステータス || row.status) !== status) return false;\n\n      return true;\n    });\n\n    currentPage = 1;\n    renderRows(filteredData);\n  }\n\n  // CSVエクスポート\n  function exportCSV() {\n    const headers = ['発注番号', '発注日', '商品名', '数量', '単価', '金額', 'ステータス'];\n    const csvContent = '\\uFEFF' + [\n      headers.join(','),\n      ...filteredData.map(row => [\n        `\"${row.発注番号 || row.orderNumber || ''}\"`,\n        `\"${row.発注日時 ? new Date(row.発注日時).toLocaleDateString('ja-JP') : (row.orderDate || '')}\"`,\n        `\"${row.商品名 || row.productName || ''}\"`,\n        row.発注数量 || row.quantity || 0,\n        row.単価 || row.unitPrice || 0,\n        row.小計金額 || row.totalAmount || 0,\n        `\"${row.発注ステータス || row.status || ''}\"`\n      ].join(','))\n    ].join('\\n');\n\n    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });\n    const link = document.createElement('a');\n    link.href = URL.createObjectURL(blob);\n    link.download = `発注履歴_${new Date().toISOString().split('T')[0]}.csv`;\n    link.click();\n  }\n\n  // 発注詳細表示\n  function showOrderDetail(orderId) {\n    const order = allOrderHistory.find(o => (o.id || o.発注ID) === orderId);\n    if (!order) return;\n\n    const modal = container.querySelector('#order-detail-modal');\n    const content = container.querySelector('#order-detail-content');\n\n    content.innerHTML = `\n      <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;\">\n        <div>\n          <label style=\"font-size: 12px; color: var(--text-muted);\">発注番号</label>\n          <div style=\"font-weight: 600; color: var(--text);\">${order.発注番号 || order.orderNumber || ''}</div>\n        </div>\n        <div>\n          <label style=\"font-size: 12px; color: var(--text-muted);\">発注日時</label>\n          <div style=\"color: var(--text);\">${order.発注日時 ? new Date(order.発注日時).toLocaleString('ja-JP') : (order.orderDate || '')}</div>\n        </div>\n        <div>\n          <label style=\"font-size: 12px; color: var(--text-muted);\">商品名</label>\n          <div style=\"color: var(--text);\">${order.商品名 || order.productName || ''}</div>\n        </div>\n        <div>\n          <label style=\"font-size: 12px; color: var(--text-muted);\">数量</label>\n          <div style=\"color: var(--text);\">${(order.発注数量 || order.quantity || 0).toLocaleString()}</div>\n        </div>\n        <div>\n          <label style=\"font-size: 12px; color: var(--text-muted);\">単価</label>\n          <div style=\"color: var(--text);\">¥${(order.単価 || order.unitPrice || 0).toLocaleString()}</div>\n        </div>\n        <div>\n          <label style=\"font-size: 12px; color: var(--text-muted);\">合計金額</label>\n          <div style=\"font-weight: 600; color: var(--text);\">¥${(order.小計金額 || order.totalAmount || 0).toLocaleString()}</div>\n        </div>\n        <div>\n          <label style=\"font-size: 12px; color: var(--text-muted);\">ステータス</label>\n          <div>${getStatusBadge(order.発注ステータス || order.status || '未確定')}</div>\n        </div>\n        <div>\n          <label style=\"font-size: 12px; color: var(--text-muted);\">希望納期</label>\n          <div style=\"color: var(--text);\">${order.希望納期 ? new Date(order.希望納期).toLocaleDateString('ja-JP') : (order.deliveryDate || '指定なし')}</div>\n        </div>\n      </div>\n      ${order.備考 || order.notes ? `\n        <div style=\"margin-top: 16px;\">\n          <label style=\"font-size: 12px; color: var(--text-muted);\">備考</label>\n          <div style=\"color: var(--text); margin-top: 4px; padding: 8px; background: rgba(0,0,0,0.1); border-radius: 4px;\">${order.備考 || order.notes}</div>\n        </div>\n      ` : ''}\n    `;\n\n    modal.style.display = 'block';\n  }\n\n  // 初期データ読み込み\n  window.aivicApi.list(5).then(rows => {\n    if (rows) {\n      allOrderHistory = rows;\n      filteredData = [...rows];\n      renderRows(filteredData);\n    } else {\n      // APIが利用できない場合は初期データを使用\n      allOrderHistory = tables[5]?.records || [];\n      filteredData = [...allOrderHistory];\n      renderRows(filteredData);\n    }\n  });\n\n  // イベントリスナー\n  container.querySelector('#btn-search').addEventListener('click', applyFilters);\n\n  container.querySelector('#btn-clear').addEventListener('click', () => {\n    container.querySelector('#start-date').value = '';\n    container.querySelector('#end-date').value = '';\n    container.querySelector('#order-number').value = '';\n    container.querySelector('#product-name').value = '';\n    container.querySelector('#category-filter').value = '';\n    container.querySelector('#status-filter').value = '';\n    filteredData = [...allOrderHistory];\n    currentPage = 1;\n    renderRows(filteredData);\n  });\n\n  container.querySelector('#btn-export').addEventListener('click', exportCSV);\n\n  container.querySelector('#page-size').addEventListener('change', (e) => {\n    pageSize = parseInt(e.target.value);\n    currentPage = 1;\n    renderRows(filteredData);\n  });\n\n  container.querySelector('#prev-page').addEventListener('click', () => {\n    if (currentPage > 1) {\n      currentPage--;\n      renderRows(filteredData);\n    }\n  });\n\n  container.querySelector('#next-page').addEventListener('click', () => {\n    const totalPages = Math.ceil(filteredData.length / pageSize);\n    if (currentPage < totalPages) {\n      currentPage++;\n      renderRows(filteredData);\n    }\n  });\n\n  // モーダル関連\n  container.querySelector('#btn-close-modal').addEventListener('click', () => {\n    container.querySelector('#order-detail-modal').style.display = 'none';\n  });\n\n  container.querySelector('#btn-reorder').addEventListener('click', () => {\n    window.showScreen('scr-1780291074387'); // 発注入力・確認画面\n  });\n\n  // 行レベル操作のイベントデリゲーション\n  container.addEventListener('click', (e) => {\n    const detailBtn = e.target.closest('.detail-btn');\n    const reorderBtn = e.target.closest('.reorder-btn');\n    const row = e.target.closest('tr[data-id]');\n\n    if (detailBtn) {\n      e.stopPropagation();\n      showOrderDetail(detailBtn.dataset.id);\n    } else if (reorderBtn) {\n      e.stopPropagation();\n      window.showScreen('scr-1780291074387'); // 発注入力・確認画面\n    } else if (row && row.dataset.id) {\n      showOrderDetail(row.dataset.id);\n    }\n  });\n\n  // モーダル背景クリックで閉じる\n  container.querySelector('#order-detail-modal').addEventListener('click', (e) => {\n    if (e.target === e.currentTarget) {\n      e.currentTarget.style.display = 'none';\n    }\n  });\n}";
</script>

          再発注
        </button>
        <button id="btn-close-modal" class="action-btn secondary" style="background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,0.18); padding: 8px 16px; border-radius: 4px; font-size: 14px;">
          閉じる
        </button>
      </div>
    </div>
  </div>
</div>
    </section>
  </main>
</div>
<script>
(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
