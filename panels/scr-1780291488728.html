amp","required":true,"description":"レコード最終更新日時"},{"name":"作成者","type":"varchar(100)","required":true,"description":"レコード作成者のユーザーID"},{"name":"更新者","type":"varchar(100)","required":true,"description":"レコード最終更新者のユーザーID"}]}];

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  // DOM要素の取得\n  const customerSelect = container.querySelector('#select-customer');\n  const productSearchInput = container.querySelector('#input-product-search');\n  const currentPriceInput = container.querySelector('#input-current-price');\n  const newPriceInput = container.querySelector('#input-new-price');\n  const requestTypeSelect = container.querySelector('#select-request-type');\n  const startDateInput = container.querySelector('#input-start-date');\n  const endDateInput = container.querySelector('#input-end-date');\n  const reasonTextarea = container.querySelector('#textarea-reason');\n  const approverSelect = container.querySelector('#select-approver');\n  const previewContent = container.querySelector('#preview-content');\n  const fileDropZone = container.querySelector('#file-drop-zone');\n  const fileInput = container.querySelector('#file-input');\n  const fileList = container.querySelector('#file-list');\n  \n  let selectedFiles = [];\n  let selectedProduct = null;\n\n  // プレビュー更新関数\n  function updatePreview() {\n    const customer = customerSelect.options[customerSelect.selectedIndex]?.text || '';\n    const product = selectedProduct ? selectedProduct.name : '';\n    const currentPrice = currentPriceInput.value;\n    const newPrice = newPriceInput.value;\n    const requestType = requestTypeSelect.options[requestTypeSelect.selectedIndex]?.text || '';\n    const startDate = startDateInput.value;\n    const endDate = endDateInput.value;\n    const reason = reasonTextarea.value;\n    const approver = approverSelect.options[approverSelect.selectedIndex]?.text || '';\n    const priority = container.querySelector('input[name=\"priority\"]:checked')?.value || '';\n\n    const priorityText = { low: '低', medium: '中', high: '高' }[priority] || '';\n\n    previewContent.innerHTML = `\n      <div style=\"display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px; font-size: 14px;\">\n        <div style=\"color: var(--text-muted);\">顧客:</div>\n        <div style=\"color: var(--text);\">${customer}</div>\n        <div style=\"color: var(--text-muted);\">商品:</div>\n        <div style=\"color: var(--text);\">${product}</div>\n        <div style=\"color: var(--text-muted);\">申請種別:</div>\n        <div style=\"color: var(--text);\">${requestType}</div>\n        <div style=\"color: var(--text-muted);\">現在単価:</div>\n        <div style=\"color: var(--text);\">${currentPrice ? `¥${Number(currentPrice).toLocaleString()}` : ''}</div>\n        <div style=\"color: var(--text-muted);\">新単価:</div>\n        <div style=\"color: var(--text);\">${newPrice ? `¥${Number(newPrice).toLocaleString()}` : ''}</div>\n        <div style=\"color: var(--text-muted);\">適用期間:</div>\n        <div style=\"color: var(--text);\">${startDate}${endDate ? ` ～ ${endDate}` : ' ～ 無期限'}</div>\n        <div style=\"color: var(--text-muted);\">変更理由:</div>\n        <div style=\"color: var(--text);\">${reason}</div>\n        <div style=\"color: var(--text-muted);\">承認者:</div>\n        <div style=\"color: var(--text);\">${approver}</div>\n        <div style=\"color: var(--text-muted);\">緊急度:</div>\n        <div style=\"color: var(--text);\">${priorityText}</div>\n        <div style=\"color: var(--text-muted);\">添付ファイル:</div>\n        <div style=\"color: var(--text);\">${selectedFiles.length}件</div>\n      </div>\n    `;\n  }\n\n  // 商品検索\n  container.querySelector('#btn-product-search').addEventListener('click', async () => {\n    const keyword = productSearchInput.value.trim();\n    if (!keyword) return;\n\n    // 模擬的な商品検索結果\n    const mockProducts = [\n      { id: 'prod-001', name: 'スチールパイプ φ25mm', code: 'SP-025', currentPrice: 1200 },\n      { id: 'prod-002', name: 'アルミパイプ φ30mm', code: 'AP-030', currentPrice: 1800 },\n      { id: 'prod-003', name: '銅管 φ15mm', code: 'CP-015', currentPrice: 2500 },\n      { id: 'prod-004', name: 'ステンレスパイプ φ20mm', code: 'SSP-020', currentPrice: 3200 }\n    ];\n\n    const results = mockProducts.filter(p => \n      p.name.includes(keyword) || p.code.includes(keyword)\n    );\n\n    if (results.length > 0) {\n      selectedProduct = results[0];\n      productSearchInput.value = `${selectedProduct.name} (${selectedProduct.code})`;\n      currentPriceInput.value = selectedProduct.currentPrice;\n      updatePreview();\n    } else {\n      alert('該当する商品が見つかりませんでした');\n    }\n  });\n\n  // ファイルドロップ処理\n  fileDropZone.addEventListener('dragover', (e) => {\n    e.preventDefault();\n    fileDropZone.style.borderColor = 'var(--primary)';\n    fileDropZone.style.backgroundColor = 'rgba(0,0,0,0.25)';\n  });\n\n  fileDropZone.addEventListener('dragleave', (e) => {\n    e.preventDefault();\n    fileDropZone.style.borderColor = 'rgba(255,255,255,0.3)';\n    fileDropZone.style.backgroundColor = 'rgba(0,0,0,0.15)';\n  });\n\n  fileDropZone.addEventListener('drop', (e) => {\n    e.preventDefault();\n    fileDropZone.style.borderColor = 'rgba(255,255,255,0.3)';\n    fileDropZone.style.backgroundColor = 'rgba(0,0,0,0.15)';\n    \n    const files = Array.from(e.dataTransfer.files);\n    addFiles(files);\n  });\n\n  container.querySelector('#btn-file-select').addEventListener('click', () => {\n    fileInput.click();\n  });\n\n  fileInput.addEventListener('change', (e) => {\n    const files = Array.from(e.target.files);\n    addFiles(files);\n  });\n\n  function addFiles(files) {\n    selectedFiles = [...selectedFiles, ...files];\n    renderFileList();\n    updatePreview();\n  }\n\n  function renderFileList() {\n    fileList.innerHTML = selectedFiles.map((file, index) => `\n      <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(0,0,0,0.25); border-radius: 4px; margin-bottom: 8px;\">\n        <span style=\"color: var(--text); font-size: 14px;\">${file.name} (${(file.size / 1024).toFixed(1)}KB)</span>\n        <button class=\"action-btn secondary\" onclick=\"removeFile(${index})\" style=\"padding: 4px 8px; font-size: 12px;\">削除</button>\n      </div>\n    `).join('');\n  }\n\n  window.removeFile = function(index) {\n    selectedFiles.splice(index, 1);\n    renderFileList();\n    updatePreview();\n  };\n\n  // フォーム変更時のプレビュー更新\n  [customerSelect, newPriceInput, requestTypeSelect, startDateInput, endDateInput, reasonTextarea, approverSelect].forEach(element => {\n    element.addEventListener('change', updatePreview);\n    element.addEventListener('input', updatePreview);\n  });\n\n  container.querySelectorAll('input[name=\"priority\"]').forEach(radio => {\n    radio.addEventListener('change', updatePreview);\n  });\n\n  // 一時保存\n  container.querySelector('#btn-draft-save').addEventListener('click', async () => {\n    const formData = collectFormData();\n    formData.申請状態 = '下書き';\n    \n    const saved = await window.aivicApi.save(1, formData); // 単価更新申請テーブル\n    if (saved) {\n      alert('一時保存しました');\n    }\n  });\n\n  // 申請実行\n  container.querySelector('#btn-submit').addEventListener('click', async () => {\n    if (!validateForm()) return;\n\n    const formData = collectFormData();\n    formData.申請状態 = '申請中';\n    \n    const saved = await window.aivicApi.save(1, formData); // 単価更新申請テーブル\n    if (saved) {\n      // 承認ワークフロー作成\n      const workflowData = {\n        申請ID: saved.申請ID,\n        承認段階: 1,\n        承認者ID: approverSelect.value,\n        承認者名: approverSelect.options[approverSelect.selectedIndex]?.text || '',\n        承認ステータス: '承認待ち',\n        期限日時: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString(), // 7日後\n        通知済フラグ: false\n      };\n      \n      await window.aivicApi.save(2, workflowData); // 単価承認ワークフローテーブル\n      \n      alert('申請を送信しました');\n      // フォームリセット\n      container.querySelectorAll('input, select, textarea').forEach(el => {\n        if (el.type !== 'radio') el.value = '';\n      });\n      selectedFiles = [];\n      selectedProduct = null;\n      renderFileList();\n      updatePreview();\n    }\n  });\n\n  function collectFormData() {\n    const priority = container.querySelector('input[name=\"priority\"]:checked')?.value || 'medium';\n    \n    return {\n      顧客ID: customerSelect.value,\n      商品ID: selectedProduct?.id || '',\n      申請種別: requestTypeSelect.value,\n      現在単価: currentPriceInput.value ? parseInt(currentPriceInput.value) : null,\n      申請単価: parseInt(newPriceInput.value),\n      適用開始日: startDateInput.value,\n      適用終了日: endDateInput.value || null,\n      申請理由: reasonTextarea.value,\n      申請者ID: 'current-user-id', // 実際はログインユーザーID\n      承認者ID: approverSelect.value,\n      緊急度: priority\n    };\n  }\n\n  function validateForm() {\n    if (!customerSelect.value) {\n      alert('顧客を選択してください');\n      return false;\n    }\n    if (!selectedProduct) {\n      alert('商品を選択してください');\n      return false;\n    }\n    if (!newPriceInput.value) {\n      alert('新単価を入力してください');\n      return false;\n    }\n    if (!startDateInput.value) {\n      alert('適用開始日を選択してください');\n      return false;\n    }\n    if (!reasonTextarea.value.trim()) {\n      alert('変更理由を入力してください');\n      return false;\n    }\n    if (!approverSelect.value) {\n      alert('承認者を選択してください');\n      return false;\n    }\n    return true;\n  }\n\n  // 初期設定\n  const today = new Date().toISOString().split('T')[0];\n  startDateInput.value = today;\n  updatePreview();\n}";
</script>

(function() {
  var TABLE_DEFS = window.AIVIC_TABLES || [];
  var PRESET_SEED = window.AIVIC_PRESET_SEED || {};
  var SYSTEM_NAME = window.AIVIC_SYSTEM_NAME || "";
  var APP_ID = window.AIVIC_APP_ID || "";
  var API_URL = (window.AIVIC_API_URL && window.AIVIC_API_URL !== "REPLACE_WITH_API_URL")
    ? window.AIVIC_API_URL : window.location.origin;

  // 通知 helper（SPA 版と同じ）
  window.aivicNotify = (function() {
    function ensureContainer() {
      var c = document.getElementById("aivic-toast-container");
      if (c) return c;
      c = document.createElement("div");
      c.id = "aivic-toast-container";
      c.style.cssText = "position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:360px;";
      document.body.appendChild(c);
      return c;
    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
      }, type === "error" ? 6000 : 4500);
    }
    return {
      error: function(msg) { show("❌ " + msg, "error"); },
      warn:  function(msg) { show("⚠️ " + msg, "warn"); },
    };
  })();

  // CRUD API（SPA 版と同じ）
  window.aivicApi = (function() {
    function dbErr(op) { window.aivicNotify.error("データベースエラー（" + op + "）: APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";
      return "?app=" + encodeURIComponent(APP_ID) + "&system=" + encodeURIComponent(SYSTEM_NAME) + "&table=" + encodeURIComponent(t ? t.tableName : "table" + i) + dbP;
    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }
      },
      delete: async function(tableIndex, id) {
        if (!API_URL) { dbErr("削除"); return {deleted:false}; }
        try { await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), {method:"DELETE"}); return {deleted:true}; }
        catch(e) { dbErr("削除"); return {deleted:false}; }
      },
    };
  })();

  // showScreen はマルチページ構成ではページ遷移として動く。
  // パネル切替 (旧 SPA 動作) ではなく ./<id>.html への navigate に再定義する。
  // 既存の AI 生成 shell が onclick="showScreen('x')" の形で書いていても透過的に動く。
  //
  // 防御層:
  // (a) 同じ画面 ID なら no-op（AIVIC_PAGE_SCREEN_ID 一致 / pathname 一致のどちらか）
  // (b) 同じ navigate を 100ms 以内に繰り返したら break loop（onclick 連打ではなく自動ループ対策）
  // (c) DOMContentLoaded 直後 1.5s 以内の「自動 navigate」は警告 + 抑制（手動 click は通す）
  var _aivicNavLastTime = 0;
  var _aivicNavLastTarget = "";
  var _aivicReady = false;
  window.showScreen = function(screenId) {
    if (!screenId) return;
    if (screenId === window.AIVIC_PAGE_SCREEN_ID) return; // 既に該当ページに居る
    // pathname ベースの保険: AIVIC_PAGE_SCREEN_ID が未設定でも、現在 URL と一致したら抑制
    var targetPath = './' + encodeURIComponent(screenId) + '.html';
    var currentName = (window.location.pathname.split('/').pop() || '');
    if (currentName === (encodeURIComponent(screenId) + '.html') ||
        currentName === (screenId + '.html')) {
      return;
    }
    var now = Date.now();
    if (_aivicNavLastTarget === targetPath && (now - _aivicNavLastTime) < 100) {
      console.warn('[aivic] showScreen 連続呼び出し検知。無限ループ防止のため抑制:', screenId);
      return;
    }
    if (!_aivicReady) {
      // ページロード直後の自動 navigate は AI shell の load-time 副作用の可能性が高い。
      // ボタンクリック等のユーザー操作は ready 後なので影響しない。
      console.warn('[aivic] DOMContentLoaded 前の showScreen 呼び出し。抑制:', screenId);
      return;
    }
    _aivicNavLastTime = now;
    _aivicNavLastTarget = targetPath;
    window.location.href = targetPath;
  };

  // 初回マウント時のサンプルデータ投入
  function seedAllIfEmpty() {
    if (!API_URL) return Promise.resolve();
    return Promise.all(TABLE_DEFS.map(function(t, i) {
      var preset = PRESET_SEED[t.tableName];
      if (!Array.isArray(preset) || preset.length === 0) return Promise.resolve();
      return window.aivicApi.list(i).then(function(existing) {
        if (existing && existing.length > 0) return;
        return Promise.all(preset.map(function(row) { return window.aivicApi.save(i, row); }));
      }).catch(function() {});
    }));
  }

  // ── 初期表示: このページ専用の panel に initFn を実行 ──
  // window.AIVIC_PAGE_SCREEN_ID と AIVIC_PAGE_INIT_JS は composeMultipagePages
  // でページ単位に埋め込まれる。
  document.addEventListener("DOMContentLoaded", function() {
    // 1.5 秒後に必ず _aivicReady を立てる（initFn が走らないページや失敗ページでも
    // ユーザーが操作できるようにする保険）。initFn 完了時にも立てるので早い方が勝つ。
    setTimeout(function() { _aivicReady = true; }, 1500);
    var pageScreenId = window.AIVIC_PAGE_SCREEN_ID;
    if (!pageScreenId) return;

    // sidebar / nav の active class を付与（現在ページのリンクを強調）
    document.querySelectorAll('[data-aivic-nav]').forEach(function(btn) {
      var isActive = btn.getAttribute("data-aivic-nav") === pageScreenId;
      btn.classList.toggle("aivic-active", isActive);
      btn.setAttribute("aria-current", isActive ? "page" : "false");
    });

    var container = document.querySelector('[data-aivic-panel="' + pageScreenId + '"]');
    if (!container) return;

    // **content 要素の hidden 強制除去（2026-05-24 Playwright 大量 fail 対応）**:
    // AI が生成した panel HTML には class="hidden" / hidden 属性 / style="display:none"
    // が content 要素（#xxx-tbody / #xxx-list / [data-testid="error-message"] 等）に付いて
    // いることがある。それを Playwright が toBeVisible() で待ち続けて timeout する事故が頻発。
    //
    // ポリシー: panel コンテナ配下の全要素について以下を実行:
    //   - class="hidden" / display:none / hidden 属性を **content 要素では除去**
    //   - **modal 系**（.modal, .modal-backdrop, [role="dialog"], [data-modal] 等）は除外
    //     （これらは仕様上初期非表示が正しい）
    var isModalLike = function(el) {
      if (!el || !el.classList) return false;
      var cn = String(el.className || "");
      if (/modal|dialog|overlay|popup|dropdown|tooltip/i.test(cn)) return true;
      var role = el.getAttribute && el.getAttribute("role");
      if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup"))) return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        // modal 系は触らない
        if (isModalLike(el)) continue;
        // parent chain で modal 内なら触らない
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        // 除去
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      // initJs が無くてもサンプルデータ投入は走らせる
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      // 初期 panel init が一巡したら _aivicReady を立てる。以降のユーザー操作 (onclick) で
      // showScreen が呼ばれた場合は通常通り navigate する。
      _aivicReady = true;
    });
  });
})();

</script>
</body>
</html>
